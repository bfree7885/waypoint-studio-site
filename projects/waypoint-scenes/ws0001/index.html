<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Waypoint Scenes — WS_0001</title>

<style>
html,body{margin:0;overflow:hidden;height:100%;background:#02050b;cursor:none}
:root{
  --a1: rgba(72,104,118,.12);
  --a2: rgba(64,92,112,.09);
  --a3: rgba(56,78,100,.07);
}

.layer{
  position:fixed;
  left:-15%;
  top:-15%;
  width:130%;
  height:130%;
  background-image:url("assets/ws0001.jpg");
  background-size:cover;
  background-position:center;
  will-change:transform;
}

#back{opacity:.36;filter:blur(21px) brightness(.60) saturate(.72) contrast(.84)}
#mid{opacity:.74;filter:blur(4px) brightness(.72) saturate(.8) contrast(.88)}
#front{opacity:1;filter:brightness(.82) saturate(.86) contrast(.9)}

#trees{
  position:fixed;
  left:-18%;
  top:-18%;
  width:136%;
  height:136%;
  background-image:url("assets/ws0001.jpg");
  background-size:cover;
  background-position:center;
  mix-blend-mode:soft-light;
  opacity:.15;
  filter:contrast(1.14) brightness(.78) saturate(.74) blur(1.2px);
  pointer-events:none;
  will-change:transform;
}

#aurora{
  position:fixed;
  inset:-52% -36% -10% -20%;
  background:
    radial-gradient(ellipse at 22% 19%,var(--a1),transparent 36%),
    radial-gradient(ellipse at 47% 16%,var(--a2),transparent 40%),
    radial-gradient(ellipse at 76% 13%,var(--a3),transparent 38%);
  mix-blend-mode:screen;
  filter:blur(78px);
  opacity:.09;
  pointer-events:none;
  will-change:transform;
}

#fog{
  position:fixed;
  inset:-24%;
  background:
    radial-gradient(circle at 26% 64%,rgba(170,190,212,.03),transparent 44%),
    radial-gradient(circle at 64% 72%,rgba(148,170,194,.026),transparent 48%),
    radial-gradient(circle at 86% 56%,rgba(156,178,204,.018),transparent 42%);
  mix-blend-mode:screen;
  pointer-events:none;
  filter:blur(34px);
  will-change:transform;
}

#dawnGlow{
  position:fixed;
  inset:-25%;
  background:
    radial-gradient(ellipse at 50% 88%,rgba(255,165,90,.42),transparent 45%),
    radial-gradient(ellipse at 50% 80%,rgba(255,210,160,.26),transparent 54%);
  mix-blend-mode:screen;
  opacity:0;
  filter:blur(28px);
  pointer-events:none;
  will-change:transform,opacity;
}

#skyTint{
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(ellipse at 40% 14%,rgba(85,112,145,.16),transparent 58%),
    radial-gradient(ellipse at 74% 10%,rgba(74,98,128,.1),transparent 62%),
    linear-gradient(180deg,rgba(36,48,66,.2),transparent 38%);
  mix-blend-mode:soft-light;
  opacity:.38;
  filter:blur(34px);
  pointer-events:none;
  will-change:opacity,transform;
}

#vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 48% 58%,transparent 48%,rgba(0,0,0,.46));
  pointer-events:none;
}

#terrainRoughness{
  position:fixed;
  inset:0;
  background:
    linear-gradient(0deg,rgba(8,14,22,.72) 0%,rgba(8,14,22,.44) 9%,transparent 24%),
    radial-gradient(ellipse at 18% 100%,rgba(16,24,34,.55),transparent 42%),
    radial-gradient(ellipse at 42% 100%,rgba(16,24,34,.5),transparent 39%),
    radial-gradient(ellipse at 71% 100%,rgba(16,24,34,.46),transparent 37%),
    radial-gradient(ellipse at 92% 100%,rgba(16,24,34,.52),transparent 41%);
  pointer-events:none;
  z-index:3;
  mix-blend-mode:multiply;
}

#deadfall{
  position:fixed;
  left:-12%;
  right:-8%;
  bottom:8%;
  height:26%;
  pointer-events:none;
  z-index:4;
  opacity:.25;
  background:
    linear-gradient(166deg,transparent 36%,rgba(28,40,54,.45) 37%,rgba(28,40,54,.45) 39%,transparent 40%),
    linear-gradient(171deg,transparent 44%,rgba(24,34,46,.42) 45%,rgba(24,34,46,.42) 47%,transparent 48%),
    linear-gradient(174deg,transparent 54%,rgba(22,30,42,.36) 55%,rgba(22,30,42,.36) 57%,transparent 58%),
    linear-gradient(187deg,transparent 64%,rgba(24,34,48,.32) 65%,rgba(24,34,48,.32) 67%,transparent 68%);
  filter:blur(.3px);
}

#v2TestMarker{
  position:fixed;
  left:14px;
  bottom:14px;
  color:#ffffff;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  z-index:10001;
  pointer-events:none;
  opacity:1;
  text-shadow:0 0 8px rgba(0,0,0,.6);
}

.snow{
  position:fixed;
  top:-10px;
  background:rgba(235,242,248,.95);
  border-radius:50%;
  animation-name:fall;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  pointer-events:none;
}

@keyframes fall{
  from{transform:translateY(-10vh)}
  to{transform:translateY(110vh)}
}

#title{
  position:fixed;
  left:40px;
  bottom:40px;
  color:white;
  font-family:sans-serif;
  letter-spacing:6px;
  opacity:.26;
}

#controls{
  position:fixed;
  right:30px;
  bottom:30px;
  color:white;
  font-family:sans-serif;
  opacity:.3;
}

button{
  background:rgba(0,0,0,.16);
  color:white;
  border:1px solid rgba(255,255,255,.2);
  padding:10px 14px;
  letter-spacing:2px;
}
</style>
</head>

<body>
<div id="back" class="layer"></div>
<div id="mid" class="layer"></div>
<div id="front" class="layer"></div>
<div id="trees"></div>
<div id="aurora"></div>
<div id="fog"></div>
<div id="dawnGlow"></div>
<div id="skyTint"></div>
<div id="terrainRoughness"></div>
<div id="deadfall"></div>
<div id="vignette"></div>
<div id="v2TestMarker">V2 REALISM TEST</div>

<div id="title">WAYPOINT SCENES<br>WS_0001 — NORTHERN TAIGA</div>
<div id="controls">
  <button onclick="toggleSound()">SOUND</button>
  <button onclick="captureScene()">CAPTURE SCENE</button>
</div>

<audio id="windSound" loop preload="none">
  <source src="assets/wind.mp3" type="audio/mpeg">
</audio>
<audio id="forestSound" loop preload="none">
  <source src="assets/forest.mp3" type="audio/mpeg">
</audio>
<audio id="owlSound" preload="none">
  <source src="assets/owl.mp3" type="audio/mpeg">
</audio>

<script>
const back = document.getElementById("back")
const mid = document.getElementById("mid")
const front = document.getElementById("front")
const trees = document.getElementById("trees")
const fog = document.getElementById("fog")
const aurora = document.getElementById("aurora")
const dawnGlow = document.getElementById("dawnGlow")
const skyTint = document.getElementById("skyTint")
const terrainRoughness = document.getElementById("terrainRoughness")
const deadfall = document.getElementById("deadfall")
const windSound = document.getElementById("windSound")
const forestSound = document.getElementById("forestSound")
const owlSound = document.getElementById("owlSound")

const AURORA_COLORS = [
  "rgba(72,104,118,.12)",
  "rgba(64,92,112,.09)",
  "rgba(56,78,100,.07)",
  "rgba(88,112,128,.08)"
]

const INPUT_LERP = 0.04
const SNOW_COUNT = 56
const snowflakes = []

let x = 0
let y = 0
let tx = 0
let ty = 0
let ambientEnabled = false
let ambientTimer = 0
let idleMix = 1
let iceAudioCtx = null

function clamp(value, min, max){
  return Math.max(min, Math.min(max, value))
}

function smoothstep(edge0, edge1, value){
  const t = clamp((value - edge0) / (edge1 - edge0), 0, 1)
  return t * t * (3 - 2 * t)
}

function lerp(a, b, t){
  return a + (b - a) * t
}

function mixMood(a, b, t){
  return {
    sceneBrightness: lerp(a.sceneBrightness, b.sceneBrightness, t),
    desaturation: lerp(a.desaturation, b.desaturation, t),
    auroraBoost: lerp(a.auroraBoost, b.auroraBoost, t),
    snowOpacityMul: lerp(a.snowOpacityMul, b.snowOpacityMul, t),
    fogOpacityMul: lerp(a.fogOpacityMul, b.fogOpacityMul, t),
    vignetteDarkness: lerp(a.vignetteDarkness, b.vignetteDarkness, t),
    dawnGlow: lerp(a.dawnGlow, b.dawnGlow, t),
    warmTint: lerp(a.warmTint, b.warmTint, t),
    coolTint: lerp(a.coolTint, b.coolTint, t)
  }
}

const TIME_STOPS = [
  { hour: 0, mood: { sceneBrightness: .60, desaturation: .16, auroraBoost: 1.18, snowOpacityMul: .36, fogOpacityMul: .74, vignetteDarkness: .52, dawnGlow: .00, warmTint: .00, coolTint: .14 } },
  { hour: 5, mood: { sceneBrightness: .60, desaturation: .16, auroraBoost: 1.18, snowOpacityMul: .36, fogOpacityMul: .74, vignetteDarkness: .52, dawnGlow: .00, warmTint: .00, coolTint: .14 } },
  { hour: 7, mood: { sceneBrightness: .79, desaturation: .09, auroraBoost: .86, snowOpacityMul: .52, fogOpacityMul: .84, vignetteDarkness: .36, dawnGlow: .82, warmTint: .28, coolTint: .22 } },
  { hour: 16, mood: { sceneBrightness: .95, desaturation: .26, auroraBoost: .52, snowOpacityMul: .48, fogOpacityMul: .58, vignetteDarkness: .28, dawnGlow: .00, warmTint: .00, coolTint: .00 } },
  { hour: 18, mood: { sceneBrightness: .83, desaturation: .16, auroraBoost: .66, snowOpacityMul: .50, fogOpacityMul: .66, vignetteDarkness: .33, dawnGlow: .24, warmTint: .36, coolTint: .08 } },
  { hour: 21, mood: { sceneBrightness: .70, desaturation: .08, auroraBoost: .96, snowOpacityMul: .58, fogOpacityMul: .80, vignetteDarkness: .44, dawnGlow: .12, warmTint: .04, coolTint: .34 } },
  { hour: 24, mood: { sceneBrightness: .60, desaturation: .16, auroraBoost: 1.18, snowOpacityMul: .36, fogOpacityMul: .74, vignetteDarkness: .52, dawnGlow: .00, warmTint: .00, coolTint: .14 } }
]

function getHourDecimal(now){
  return now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600
}

function getTimeMood(now){
  const hour = getHourDecimal(now)
  for (let i = 0; i < TIME_STOPS.length - 1; i++) {
    const a = TIME_STOPS[i]
    const b = TIME_STOPS[i + 1]
    if (hour >= a.hour && hour <= b.hour) {
      const tRaw = (hour - a.hour) / (b.hour - a.hour || 1)
      return mixMood(a.mood, b.mood, smoothstep(0, 1, tRaw))
    }
  }
  return TIME_STOPS[0].mood
}

function getHourDecimalNow(){
  const now = new Date()
  return now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600
}

function getAmbientBaseByHour(hour){
  if (hour < 5) return 0.42
  if (hour < 7) return 0.24
  if (hour < 16) return 0.16
  if (hour < 18) return 0.24
  if (hour < 21) return 0.36
  return 0.4
}

function ensureIceAudioContext(){
  if (!iceAudioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext
    if (Ctx) iceAudioCtx = new Ctx()
  }
  if (iceAudioCtx?.state === "suspended") iceAudioCtx.resume()
  return iceAudioCtx
}

function playIceCreak(){
  const ctx = ensureIceAudioContext()
  if (!ctx) return
  const now = ctx.currentTime
  const oscillator = ctx.createOscillator()
  const filter = ctx.createBiquadFilter()
  const gain = ctx.createGain()
  oscillator.type = "sawtooth"
  oscillator.frequency.setValueAtTime(220, now)
  oscillator.frequency.exponentialRampToValueAtTime(82, now + 0.85)
  filter.type = "bandpass"
  filter.frequency.setValueAtTime(980, now)
  filter.frequency.exponentialRampToValueAtTime(320, now + 0.85)
  gain.gain.setValueAtTime(0.0001, now)
  gain.gain.exponentialRampToValueAtTime(0.012 + idleMix * 0.025, now + 0.08)
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95)
  oscillator.connect(filter)
  filter.connect(gain)
  gain.connect(ctx.destination)
  oscillator.start(now)
  oscillator.stop(now + 1)
}

function playOwl(){
  owlSound.currentTime = 0
  owlSound.volume = 0.04 + idleMix * 0.1
  owlSound.play().catch(() => {})
}

function scheduleAmbientEvent(){
  clearTimeout(ambientTimer)
  if (!ambientEnabled) return
  const delayMs = 18000 + Math.random() * 26000
  ambientTimer = setTimeout(() => {
    if (!ambientEnabled) return
    const hour = getHourDecimalNow()
    const night = hour >= 18 || hour < 6
    if (Math.random() < 0.62) playIceCreak()
    if (night && Math.random() < 0.44) playOwl()
    scheduleAmbientEvent()
  }, delayMs)
}

function startAmbient(){
  ambientEnabled = true
  windSound.play().catch(() => {})
  forestSound.play().catch(() => {})
  scheduleAmbientEvent()
}

function stopAmbient(){
  ambientEnabled = false
  clearTimeout(ambientTimer)
  windSound.pause()
  forestSound.pause()
  owlSound.pause()
}

function updateMouseTarget(event){
  tx = ((event.clientX / window.innerWidth) - 0.5) * 2
  ty = ((event.clientY / window.innerHeight) - 0.5) * 2
}

function makeSnow(){
  for (let i = 0; i < SNOW_COUNT; i++) {
    const s = document.createElement("div")
    const clumpBias = Math.random() < 0.62 ? (Math.random() ** 1.8) : (1 - Math.random() ** 1.6)
    const xBand = Math.random() < 0.5 ? 0.12 : 0.88
    const x = clamp((clumpBias * 0.76) + (Math.random() * 0.24 * xBand), 0, 1)
    const baseOpacity = .06 + Math.random() * .46
    const depth = Math.random()
    s.className = "snow"
    s.style.left = `${x * 100}vw`
    s.style.animationDuration = `${9 + Math.random() * 18}s`
    s.style.animationDelay = `${-Math.random() * 20}s`
    s.style.opacity = baseOpacity
    s.style.width = s.style.height = `${0.8 + depth * 2.5}px`
    if (depth < 0.35) s.style.filter = "blur(1px)"
    else if (depth > 0.82) s.style.filter = "blur(.2px)"
    s.dataset.baseOpacity = baseOpacity
    snowflakes.push(s)
    document.body.appendChild(s)
  }
}

function updateTimeMood(now, t){
  const mood = getTimeMood(now)
  const saturation = 1 - mood.desaturation

  const backBrightness = .58 + mood.sceneBrightness * .28
  const midBrightness = .66 + mood.sceneBrightness * .33
  const frontBrightness = .74 + mood.sceneBrightness * .36
  const treeBrightness = .68 + mood.sceneBrightness * .28

  back.style.filter = `blur(21px) brightness(${backBrightness * .78}) saturate(${saturation * .78}) contrast(.86)`
  mid.style.filter = `blur(4px) brightness(${midBrightness * .82}) saturate(${saturation * .84}) contrast(.9)`
  front.style.filter = `brightness(${frontBrightness * .86}) saturate(${saturation * .9}) contrast(.92)`
  trees.style.filter = `contrast(1.08) brightness(${treeBrightness * .82}) saturate(${saturation * .74}) blur(1.2px)`
  fog.style.opacity = clamp(mood.fogOpacityMul * .34, .06, .28)
  aurora.style.opacity = clamp(mood.auroraBoost * .12, .04, .16)
  dawnGlow.style.opacity = clamp(mood.dawnGlow, 0, .9)
  dawnGlow.style.transform = `translate(${Math.sin(t * .35) * 24}px,${Math.cos(t * .42) * 12}px)`
  skyTint.style.opacity = clamp((mood.warmTint * .22) + (mood.coolTint * .85) + .14, .12, .48)
  skyTint.style.background = `radial-gradient(ellipse at 38% 12%,rgba(96,122,154,${mood.coolTint * .9 + .18}),rgba(52,72,96,${mood.coolTint * .65 + .14}) 52%,transparent 74%),radial-gradient(ellipse at 74% 10%,rgba(82,106,136,${mood.coolTint * .75 + .12}),transparent 66%)`
  skyTint.style.transform = `translate(${Math.sin(t * .14) * 8}px,${Math.cos(t * .11) * 6}px)`

  terrainRoughness.style.opacity = clamp(.62 + mood.vignetteDarkness * .34, .52, .86)
  deadfall.style.opacity = clamp(.16 + mood.vignetteDarkness * .16, .14, .34)

  const vignette = clamp(mood.vignetteDarkness, 0.22, 0.58)
  document.getElementById("vignette").style.background = `radial-gradient(circle,transparent 55%,rgba(0,0,0,${vignette}))`

  for (let i = 0; i < snowflakes.length; i++) {
    const flake = snowflakes[i]
    const baseOpacity = Number(flake.dataset.baseOpacity || .35)
    flake.style.opacity = clamp(baseOpacity * mood.snowOpacityMul, .03, .95)
  }
}

function toggleSound(){
  if (ambientEnabled) stopAmbient()
  else startAmbient()
}

function updateAmbient(motionAmount){
  const hour = getHourDecimalNow()
  const base = getAmbientBaseByHour(hour)
  const targetIdle = 1 - motionAmount
  idleMix += (targetIdle - idleMix) * 0.035
  const idleBoost = 0.45 + idleMix * 0.55

  const windTarget = ambientEnabled ? base * (0.72 + idleBoost * 0.35) : 0
  const forestTarget = ambientEnabled ? base * (0.52 + idleBoost * 0.28) : 0
  windSound.volume += (windTarget - windSound.volume) * 0.05
  forestSound.volume += (forestTarget - forestSound.volume) * 0.05
}

function getSceneCode(){
  const now = new Date()
  const hh = String(now.getHours()).padStart(2, "0")
  const mm = String(now.getMinutes()).padStart(2, "0")
  return `WS0001-AURORA-${hh}${mm}`
}

function createCaptureTag(){
  const now = new Date()
  const tag = document.createElement("div")
  tag.id = "captureTag"
  tag.textContent = `${getSceneCode()}  LOCAL ${now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`
  tag.style.position = "fixed"
  tag.style.left = "16px"
  tag.style.top = "16px"
  tag.style.padding = "8px 11px"
  tag.style.background = "rgba(0,0,0,.45)"
  tag.style.border = "1px solid rgba(255,255,255,.35)"
  tag.style.color = "white"
  tag.style.fontFamily = "monospace"
  tag.style.fontSize = "11px"
  tag.style.letterSpacing = "1px"
  tag.style.zIndex = "9999"
  tag.style.pointerEvents = "none"
  return tag
}

async function captureScene(){
  const captureTag = createCaptureTag()
  document.body.appendChild(captureTag)

  try {
    await new Promise(resolve => requestAnimationFrame(resolve))
    const clone = document.documentElement.cloneNode(true)
    clone.querySelectorAll("script").forEach(node => node.remove())
    clone.setAttribute("xmlns", "http://www.w3.org/1999/xhtml")

    const serializer = new XMLSerializer()
    const serialized = serializer.serializeToString(clone)
    const width = window.innerWidth
    const height = window.innerHeight
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%">${serialized}</foreignObject></svg>`
    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" })
    const url = URL.createObjectURL(blob)
    const image = new Image()

    await new Promise((resolve, reject) => {
      image.onload = resolve
      image.onerror = reject
      image.src = url
    })

    const canvas = document.createElement("canvas")
    canvas.width = width
    canvas.height = height
    const ctx = canvas.getContext("2d")
    ctx.drawImage(image, 0, 0)
    URL.revokeObjectURL(url)

    const link = document.createElement("a")
    link.download = `${getSceneCode()}.png`
    link.href = canvas.toDataURL("image/png")
    link.click()
  } catch (_error) {
    // Fail silently to avoid disrupting scene runtime.
  } finally {
    captureTag.remove()
  }
}

function animate(){
  x += (tx - x) * INPUT_LERP
  y += (ty - y) * INPUT_LERP
  const motionAmount = clamp((Math.abs(tx - x) + Math.abs(ty - y)) * 1.7, 0, 1)

  const nowMs = Date.now()
  const t = nowMs * .0002
  const c = Math.floor((nowMs / 6000) % 4)

  document.documentElement.style.setProperty("--a1", AURORA_COLORS[c])
  document.documentElement.style.setProperty("--a2", AURORA_COLORS[(c + 1) % 4])
  document.documentElement.style.setProperty("--a3", AURORA_COLORS[(c + 2) % 4])

  back.style.transform = `translate(${-x*38}px,${-y*13}px) scale(1.2)`
  mid.style.transform = `translate(${-x*92}px,${-y*38}px) scale(1.1)`
  front.style.transform = `translate(${-x*162}px,${-y*68}px) scale(1.04)`
  trees.style.transform = `translate(${-x*252}px,${-y*102}px) scale(1.03)`

  fog.style.transform = `translate(${Math.sin(t*.56)*26 - x*4}px,${Math.cos(t*.33)*10 - y*3}px)`
  aurora.style.transform = `translate(${Math.sin(t*.22)*38}px,${Math.cos(t*.13)*8}px) rotate(${Math.sin(t*.08)*.5}deg) scale(${1.02+Math.sin(t*.16)*.01})`

  updateTimeMood(new Date(nowMs), t)
  updateAmbient(motionAmount)
  requestAnimationFrame(animate)
}

function enterFullscreenOnce(){
  document.documentElement.requestFullscreen?.()
}

document.addEventListener("mousemove", updateMouseTarget)
document.addEventListener("click", enterFullscreenOnce, { once: true })

makeSnow()
animate()
</script>
</body>
</html>
