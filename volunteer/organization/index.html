<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organization profile — Waypoint Volunteer">
  <title>Organization | Waypoint Volunteer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/volunteer.css">
</head>
<body class="vol-page">
  <a class="vol-skip" href="#vol-page-main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../">Waypoint Studio</a>
      <nav class="site-nav" aria-label="Main">
        <a href="../">Volunteer</a>
        <a href="../saved/">Saved</a>
      </nav>
    </div>
  </header>
  <main class="wrap vol-page-main" id="vol-page-main">
    <p class="vol-back"><a href="../">← Back to discovery</a></p>
    <div id="vol-page-root" aria-live="polite">
      <p class="muted">Loading organization…</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">Waypoint Studio · Observe. Discover. Understand.</div>
  </footer>
  <script src="../data/model.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../data/organizations.js"></script>
  <script src="../data/opportunities.js"></script>
  <script src="../data/enrichment.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/planning.js"></script>
  <script src="../js/detail.js"></script>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var root = document.getElementById("vol-page-root");
    var org = id && window.VolunteerOrganizations.get(id);
    if (!org) {
      root.innerHTML =
        '<div class="vol-empty"><h1>Organization not found</h1><p><a href="../">Return to discovery</a>.</p></div>';
      return;
    }
    document.title = org.name + " | Waypoint Volunteer";
    var opps = window.VolunteerOpportunities.byOrganization(org.id);

    function render() {
      root.innerHTML = window.VolunteerDetail.renderOrganizationPage(org, opps, {
        linkBase: "../"
      });
      var btn = root.querySelector('[data-action="org"]');
      if (btn) {
        btn.addEventListener("click", function () {
          window.VolunteerPlanning.toggleOrgBookmark(org.id);
          render();
        });
      }
    }
    render();
  })();
  </script>
</body>
</html>
