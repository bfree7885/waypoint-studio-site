<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Opportunity details — Waypoint Volunteer">
  <title>Opportunity | Waypoint Volunteer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/volunteer.css">
</head>
<body class="vol-page">
  <a class="vol-skip" href="#vol-page-main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../">Waypoint Studio</a>
      <nav class="site-nav" aria-label="Main">
        <a href="../">Volunteer</a>
        <a href="../saved/">Saved</a>
      </nav>
    </div>
  </header>
  <main class="wrap vol-page-main" id="vol-page-main">
    <p class="vol-back"><a href="../">← Back to discovery</a></p>
    <div id="vol-page-root" aria-live="polite">
      <p class="muted">Loading opportunity…</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">Waypoint Studio · Observe. Understand. Create. Share.</div>
  </footer>
  <script src="../data/model.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../data/organizations.js"></script>
  <script src="../data/opportunities.js"></script>
  <script src="../data/enrichment.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/planning.js"></script>
  <script src="../js/detail.js"></script>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var root = document.getElementById("vol-page-root");
    var opp = id && window.VolunteerOpportunities.get(id);
    if (!opp) {
      root.innerHTML =
        '<div class="vol-empty"><h1>Opportunity not found</h1><p>This demo listing may have moved. <a href="../">Return to discovery</a>.</p></div>';
      return;
    }
    document.title = opp.title + " | Waypoint Volunteer";
    root.innerHTML = window.VolunteerDetail.renderOpportunityPage(opp, {
      linkBase: "../"
    });

    function refreshActions() {
      root.innerHTML = window.VolunteerDetail.renderOpportunityPage(opp, {
        linkBase: "../"
      });
      bind();
    }

    function bind() {
      root.querySelectorAll("[data-action]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var action = btn.getAttribute("data-action");
          var oid = btn.getAttribute("data-opp-id") || opp.id;
          if (action === "save") window.VolunteerPlanning.toggleSaved(oid);
          if (action === "completed") window.VolunteerPlanning.toggleCompleted(oid);
          if (action === "list") window.VolunteerPlanning.togglePersonalList(oid);
          refreshActions();
        });
      });
      var saveNote = document.getElementById("vol-note-save");
      if (saveNote) {
        saveNote.addEventListener("click", function () {
          var area = document.getElementById("vol-note-input");
          window.VolunteerPlanning.setNote(opp.id, area.value);
          var status = document.getElementById("vol-note-status");
          if (status) status.textContent = "Note saved privately in this browser.";
        });
      }
    }
    bind();
  })();
  </script>
</body>
</html>
