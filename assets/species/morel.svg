<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Morel mushroom silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c6ff4d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8fad3a" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a8b72" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>
  <ellipse cx="200" cy="248" rx="120" ry="12" fill="#000" opacity="0.2"/>
