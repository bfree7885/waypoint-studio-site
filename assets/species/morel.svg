  <path d="M145 155 Q200 75 255 155" fill="none" stroke="#c6ff4d" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M155 140 Q200 95 245 140" fill="none" stroke="#c6ff4d" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M165 125 Q200 110 235 125" fill="none" stroke="#c6ff4d" stroke-opacity="0.15" stroke-width="1"/>
  <!-- pit grid suggestion -->
  <ellipse cx="175" cy="130" rx="8" ry="6" fill="#0e1524" opacity="0.35"/>
  <ellipse cx="200" cy="115" rx="10" ry="7" fill="#0e1524" opacity="0.35"/>
  <ellipse cx="225" cy="130" rx="8" ry="6" fill="#0e1524" opacity="0.35"/>
  <ellipse cx="190" cy="145" rx="7" ry="5" fill="#0e1524" opacity="0.3"/>
  <ellipse cx="215" cy="145" rx="7" ry="5" fill="#0e1524" opacity="0.3"/>
