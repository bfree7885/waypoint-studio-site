  <path d="M195 250 L188 120 Q200 85 212 120 L205 250 Z" fill="url(#trumpet)"/>
  <path d="M218 250 L212 150 Q220 125 228 150 L234 250 Z" fill="url(#trumpet)" opacity="0.85"/>
