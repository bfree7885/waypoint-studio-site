<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Black trumpet mushroom silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="trumpet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ec8e8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3a4a5a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a2230" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>
  <ellipse cx="200" cy="252" rx="90" ry="8" fill="#000" opacity="0.25"/>
