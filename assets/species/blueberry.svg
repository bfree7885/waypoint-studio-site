<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Blueberry plant silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="berry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b7ed4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a4080" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a8a4a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a6a3a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>
  <!-- branch -->
  <path d="M120 220 Q180 180 200 120 Q220 80 260 60" fill="none" stroke="#4a5a4a" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <!-- leaves -->
  <ellipse cx="155" cy="195" rx="22" ry="10" fill="url(#leaf)" transform="rotate(-25 155 195)"/>
  <ellipse cx="210" cy="145" rx="20" ry="9" fill="url(#leaf)" transform="rotate(15 210 145)"/>
  <ellipse cx="245" cy="85" rx="18" ry="8" fill="url(#leaf)" transform="rotate(-10 245 85)"/>
  <!-- berry cluster -->
  <circle cx="175" cy="175" r="14" fill="url(#berry)"/>
  <circle cx="198" cy="162" r="13" fill="url(#berry)"/>
  <circle cx="190" cy="188" r="12" fill="url(#berry)"/>
  <circle cx="215" cy="178" r="11" fill="url(#berry)" opacity="0.9"/>
  <circle cx="228" cy="130" r="13" fill="url(#berry)"/>
  <circle cx="248" cy="118" r="11" fill="url(#berry)" opacity="0.85"/>
  <!-- crown scars -->
  <circle cx="175" cy="170" r="3" fill="#0e1524" opacity="0.3"/>
  <circle cx="198" cy="157" r="3" fill="#0e1524" opacity="0.3"/>
  <circle cx="228" cy="125" r="3" fill="#0e1524" opacity="0.3"/>
</svg>
