<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Chanterelle mushroom silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc44d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4922a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b84a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a07820" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>
  <ellipse cx="200" cy="248" rx="100" ry="10" fill="#000" opacity="0.2"/>
  <!-- funnel cap with wavy margin -->
  <path d="M120 200 Q115 175 130 155 Q160 90 200 80 Q240 90 270 155 Q285 175 280 200 Q200 185 120 200 Z" fill="url(#cap)"/>
  <!-- underside ridges -->
  <path d="M140 195 Q200 165 260 195" fill="none" stroke="url(#gills)" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 188 Q200 172 250 188" fill="none" stroke="url(#gills)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M160 180 Q200 178 240 180" fill="none" stroke="url(#gills)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- wavy edge -->
  <path d="M125 198 Q145 205 165 198 Q185 205 205 198 Q225 205 245 198 Q265 205 275 198" fill="none" stroke="#ffc44d" stroke-opacity="0.3" stroke-width="2"/>
</svg>
